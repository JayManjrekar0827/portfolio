<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta | Jay Manjrekar</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main class="page meta">
    <h1>Meta</h1>
    <p>
      A self-referential look at this portfolio: how it has grown, line by line, commit by commit.
      The numbers below are computed from a code analysis of every JS, CSS, and HTML file in this repo.
    </p>

    <section>
      <div class="slider-row">
        <label for="commit-progress">Show commits until:</label>
        <input type="range" id="commit-progress" min="0" max="100" value="100" step="1">
        <time id="commit-time"></time>
      </div>
    </section>

    <section>
      <h2>Summary</h2>
      <div id="stats"></div>
    </section>

    <section>
      <h2>Commits by time of day</h2>
      <div id="chart"></div>
    </section>

    <section id="selection-summary">
      <p id="selection-count">No commits selected</p>
      <dl id="language-breakdown" class="stats languages"></dl>
    </section>

    <dl id="commit-tooltip" class="info tooltip" hidden>
      <dt>Commit</dt>
      <dd><a href="" id="commit-link" target="_blank"></a></dd>

      <dt>Date</dt>
      <dd id="commit-date"></dd>

      <dt>Time</dt>
      <dd id="commit-time"></dd>

      <dt>Author</dt>
      <dd id="commit-author"></dd>

      <dt>Lines edited</dt>
      <dd id="commit-lines"></dd>
    </dl>
  </main>
  <script type="module" src="../global.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
